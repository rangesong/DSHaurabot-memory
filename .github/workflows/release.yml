name: Prepare Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: thinkstar-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check:repo
      - run: npm run build:code
      - run: node scripts/check-release-artifacts.js
      - name: Create an unpublished Release with verified code artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-github-release.js --execute
