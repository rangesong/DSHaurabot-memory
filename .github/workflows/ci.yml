name: Check and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: thinkstar-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check:repo
      - name: Isolated synthetic tests
        run: npm test
      - name: Build code without private character resources
        run: npm run build:code
      - run: node scripts/check-release-artifacts.js
      - uses: actions/upload-artifact@v7
        with:
          name: thinkstar-core-${{ matrix.os }}
          path: |
            dist/aurabot/thinkstar-memory-*.zip
            dist/aurabot/release.json
            dist/aurabot/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
